# ツールのバージョンは mise.toml を正とする。
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: lint / fmt / dead-code / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.2
          cache: true
          install_args: node npm:pnpm

      - name: pnpm store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm dead-code
      - run: pnpm typecheck
      - run: pnpm test:run

  go:
    if: false
    name: gofmt / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.2
          cache: true
          install_args: go

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイルがある:"
            echo "$unformatted"
            exit 1
          fi

      - run: go test ./...

  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app/src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.2
          cache: true
          install_args: rust

      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/apt-archives
          key: ${{ runner.os }}-apt-tauri-deps-v2

      - name: Install Linux dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          mkdir -p "$HOME/.cache/apt-archives/partial"
          chmod -R a+rwX "$HOME/.cache/apt-archives"
          sudo apt-get update
          sudo apt-get \
            -o Dir::Cache::archives="$HOME/.cache/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true \
            install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
          # apt が root 所有の lock/partial を残すと actions/cache の保存が落ちる
          sudo chown -R "$USER:$USER" "$HOME/.cache/apt-archives"
          rm -f "$HOME/.cache/apt-archives/lock"
          rm -rf "$HOME/.cache/apt-archives/partial"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri
          shared-key: tauri
          add-job-id-key: "false"
          add-rust-environment-hash-key: "false"

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo test --features debug
